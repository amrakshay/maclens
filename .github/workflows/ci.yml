name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number = commit count
      - run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Self-test
        env:
          CI: "true"     # hardware checks (battery, sensors) are skipped on the VM
        run: swift run maclens-selftest
      - name: Build app bundle (release)
        run: ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: MacLens-${{ github.sha }}
          path: dist/MacLens-*.zip
          retention-days: 7
