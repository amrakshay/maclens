name: CodeQL

# Weekly and on demand only: a Swift scan takes ~15 min (vs ~2 min for CI) and CodeQL isn't a required check, so
# it doesn't run on pull requests (#9) or on pushes to main (15). Run it manually on a branch when needed.
on:
  schedule:
    - cron: "23 4 * * 1"   # weekly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - run: swift build
      - uses: github/codeql-action/analyze@v4
