name: CodeQL

# Not on pull requests: the Swift extractor makes a scan take ~15 min (vs ~2 min for CI), and CodeQL isn't a
# required check. Findings show up on main shortly after merge; run it manually on a branch when needed. (#9)
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # weekly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - run: swift build
      - uses: github/codeql-action/analyze@v4
