name: Release

# release-please keeps a "release PR" (version.txt + CHANGELOG.md) up to date from Conventional Commits.
# Merging it tags vX.Y.Z and creates the GitHub Release; the build job below then attaches the app.
# (Both live in one workflow because releases created with GITHUB_TOKEN don't trigger other workflows.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write       # build provenance
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}   # tap update runs once the secret exists
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Self-test
        env:
          CI: "true"
        run: swift run maclens-selftest

      - name: Build app (ad-hoc signed)
        env:
          MACLENS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Package
        run: ./scripts/package-release.sh

      - name: Check version consistency (app, zip, cask, tag)
        run: ./scripts/check-version.sh "$TAG"

      - uses: actions/attest@v4
        with:
          subject-path: dist/MacLens-*.zip

      - name: Upload to the GitHub Release
        run: gh release upload "$TAG" dist/MacLens-*.zip dist/MacLens-*.zip.sha256 --clobber

      - name: Update Homebrew tap
        if: env.HAS_TAP == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/publish-cask.sh dist/maclens.rb "${TAG#v}"
