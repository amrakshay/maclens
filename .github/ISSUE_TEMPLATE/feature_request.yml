name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like MacLens to do?
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: I understand MacLens avoids features that need root, and stays dependency-free and lightweight.
